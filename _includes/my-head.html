/* 3. Navbar Visibility: Hide mobile elements on desktop and vice versa immediately */
@media screen and (min-width: 901px) {
  .nav-shortcut, .mobile-only {
    display: none !important;
  }
}
@media screen and (max-width: 900px) {
  .desktop-only {
    display: none !important;
  }
}

/* 2. Publication Layout: Force grid immediately on desktop to prevent stack-then-grid flash */
@media screen and (min-width: 901px) {
  .pubWrapper {
    display: grid !important;
    grid-template-columns: 260px 1fr !important; /* Fixed width prevents image column from expanding */
    grid-column-gap: 20px !important;
    margin-bottom: 35px !important;
  }
  .pubText {
    grid-column: 2 !important;
  }
  .pubImage img {
    max-width: 260px !important;
    width: 100% !important;
    height: auto !important;
    border-radius: 6px !important;
    display: block !important;
  }
}

/* 3. Custom stacked publication layout for mobile (existing) */
@media screen and (max-width: 900px) {
  .pubWrapper {
    display: flex !important;
    flex-direction: column !important;
    text-align: left !important;
    gap: 1.5rem;
  }
  .pubImageWrapper {
    width: 100% !important;
    text-align: left !important;
  }
  .pubImage img {
    max-width: 100% !important;
    margin: 0 !important;
  }
  .pubLinks {
    text-align: left !important;
    margin-top: 10px !important;
  }
}
